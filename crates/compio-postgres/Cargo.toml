[package]
name = "compio-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "PostgreSQL protocol sessions over native compio sockets and tasks"
readme = "README.md"

[features]
default = ["native-tls"]
native-tls = ["dep:native-tls", "dep:tokio-native-tls"]
rustls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
async-lock = "3.4"
compio = { version = "0.19.2", default-features = false, features = ["runtime", "io-uring", "net", "io-compat", "time"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
log = "0.4"
home = "0.5"
whoami = "1.6"
rand = { version = "0.9.2", default-features = false, features = ["thread_rng"] }
tokio = { version = "1.39", default-features = false, features = ["io-util"] }
tokio-postgres = { version = "0.7.15", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
url = "2.2.2"
webpki-roots = { version = "1", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"], optional = true }

[dev-dependencies]
compio = { version = "0.19.2", default-features = false, features = ["macros"] }
